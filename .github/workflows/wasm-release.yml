name: WebAssembly release build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wasm:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 3.1.61
        actions-cache-folder: emsdk-cache

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Configure CMake with Emscripten
      run: emcmake cmake -B ${{ github.workspace }}/build-wasm -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build ${{ github.workspace }}/build-wasm --config Release -j

    - name: Smoke test tn93.wasm under Node
      run: |
        node tests/wasm_smoke.js build-wasm/tn93.js data/test.fas -t 0.05 -q > wasm_output.csv
        test "$(wc -l < wasm_output.csv)" -gt 1
        head -3 wasm_output.csv

    - name: Package artifacts
      id: package
      run: |
        VERSION="$(cat VERSION.txt | tr -d '[:space:]')"
        NAME="tn93-${VERSION}-wasm"
        mkdir -p "dist/${NAME}"
        cp build-wasm/*.js build-wasm/*.wasm "dist/${NAME}/"
        cp LICENSE "dist/${NAME}/" 2>/dev/null || true
        tar -C dist -czf "${NAME}.tar.gz" "${NAME}"
        (cd dist && zip -qr "../${NAME}.zip" "${NAME}")
        echo "name=${NAME}" >> "$GITHUB_OUTPUT"

    - name: Upload workflow artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.package.outputs.name }}
        path: dist/${{ steps.package.outputs.name }}

    - name: Attach to GitHub release
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload "${{ github.event.release.tag_name }}" \
          "${{ steps.package.outputs.name }}.tar.gz" \
          "${{ steps.package.outputs.name }}.zip" \
          --clobber
